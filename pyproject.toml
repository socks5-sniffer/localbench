[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localbench"
version = "1.0.1"
description = "Local-first system profiling for local AI workloads"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "LocalBench contributors" }]
dependencies = [
  "platformdirs>=4.3",
  "psutil>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-psutil>=6.0",
]

[project.scripts]
localbench = "localbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/localbench"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "packaging: builds and installs a real wheel to smoke-test the console-script entry point (slower; run `pytest -m \"not packaging\"` to skip)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["localbench"]
